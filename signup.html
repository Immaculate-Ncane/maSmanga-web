<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Market signup</title>
</head>
<body class="signup-page">

    <div class="signup-headings">
        <h1 class="signup-h3">Create account</h1>
        <p class="signup-intro">Join maSmanga Market Place and, start buying fresh produce</p>
    </div>

    <section class="form-area">
        <div class="form">
            <input type="text" id="name-input" placeholder="Name">
            <input type="email" id="email-input" placeholder="Email">
            <input type="tel" id="number-input" placeholder="Phone number">
            <input type="password" id="password-input" placeholder="password">
        </div>
    </section>
    <div class="checkbox-group">
        <h2>Account type:</h2>
        <div class="checkbox-options">
            <label class="checkbox-item" for="farmer">
                <input type="radio" id="farmer" name="accountType" value="farmer">
                Farmer
            </label>

            <label class="checkbox-item" for="shopper">
                <input type="radio" id="shopper" name="accountType" value="shopper">
                Shopper
            </label>
        </div>
    </div>

    <div class="create-button">
            <button class="create-btn">Create account</button>
        </div>

        <div class="save-account-option">
        <label class="remember-checkbox" for="rememberMe">
            <input type="checkbox">
            Remember me
        </label>
        </div>

        <div class="account-exist">
            Already have an account?
            <a href="signin.html">Sign in</a>
        </div>
        
<script src="script.js"></script> 
</body>
</html>
