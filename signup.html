<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Market sign up</title>
</head>
<body class="signup-page">

    <div class="signup-headings">
        <h3 class="signup-h3">Create account?</h3>
        <p class="signup-intro">Join maSmanga Market Place and, start buying fresh produce</p>
    </div>

    <section class="form-area">
        <div class="form">
            <input type="text" id="name-input" placeholder="Name">
            <input type="email" id="email-input" placeholder="Email">
            <input type="number" id="number-input" placeholder="Phone number">
            <input type="password" id="password-input" placeholder="password">
        </div>
    </section>

    <div class="">

    </div>

<script src="script.js"></script> 
</body>
</html>
