</head>
<body class="contact-page">
    <div class="Main-container"><!--this is the container that's holding everything in this page it's only going to have one style (display:flex;) only, it will move the white below to the center-->
        <div class="white-container"><!--this is the white container that the green section is on top of, this is also going to have 2 style(background-color:white; & border-radius:10px;)-->
            <div class="green-container"><!--this is the container that the heading, the svg and nav bar will be inside of-->
                <nav class="navigation-container">
                    <a href="index.html" class="the-logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-leaf"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 21c.5 -4.5 2.5 -8 7 -10" /><path d="M9 18c6.218 0 10.5 -3.288 11 -12v-2h-4.014c-9 0 -11.986 4 -12 9c0 1 0 3 2 5h3l.014 0" /></svg>
                        <h5>maSmanga Marketplace</h5>
                    </a>
                    <ul class="green-container-navlinks">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Market</a></li>
                        <li><a href="About.html">About</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
                <div class="navigation-container-text">
                    <p>GET IN TOUCH</p>
                    <h4 class="navigation-container-h4">Let's Grow Together in <span>Gcilima & Margate</span></h4>
                    <p>Reach out to our local team in KwaZulu Natal</p>
                </div>
            </div>
            <div class="contact-page-cards"> <!--this container is the one holding the below two cards-->
                <div class="first-card">
                    <h4>Location</h4>
                    <p>Gcilima Location, <br>South Coast, KwaZulu Natal</p>
                    <h4>Phone/WhatsApp:</h4>
                    <p>+27 86 123 4567</p>
                    <h4>email:</h4>
                    <p>hello@maSmanga.co.za</p>
                </div>
                <div class="second-card">
                    <input type="text" id="name-input" placeholder="Full names">
                    <input type="tel" id="cellnumber-input" placeholder="Phone number/WhatsApp">
                    <input type="text" id="message-input" placeholder="write your text here">
                    <button>Submit</button>
                </div>


            </div>

        </div>

    </div>
    <script src="script.js"></script>
