<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Market</title>
</head>
<body class="products-page">
    <header class="top-bar">
        <a href="index.html" class="menu-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 6l16 0" /><path d="M4 12l16 0" /><path d="M4 18l16 0" /></svg>
        </a>
        <h1 class="top-bar-title">Market</h1>
        <div class="top-bar-icons">
            <a href="#" class="whatsapp-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-whatsapp"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9" /><path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1" /></svg>
            </a>
            <a href="#" class="cart-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-shopping-cart-minus"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M12.5 17h-6.5v-14h-2" /><path d="M6 5l14 1l-1 7h-13" /><path d="M16 19h6" /></svg>
                <span id="cart-count">0</span>
            </a>
        </div>
    </header>
    <section class="search-area">
        <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-search"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
            <input type="search" id="search-input" placeholder="seeds, fertilizer, vehicle" aria-label="Search products">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-microphone"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 5a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3a3 3 0 0 1 -3 -3l0 -5" /><path d="M5 10a7 7 0 0 0 14 0" /><path d="M8 21l8 0" /><path d="M12 17l0 4" /></svg>
        </div>
    </section>

    <div class="product" data-name="Grape Tomatoes" data-price="20">
            <img class="product-image" src="images/grapetomatoes.jpg" alt="Grape Tomatoes">
            <div class="product-info">
                <h3 class="product-name">Grape Tomatoes</h3>
                <p class="product-price">R20/kg</p>
                <div class="product-buttons">
                    <button class="seeds-btn">Get seeds</button>
                    <button class="cart-btn">Add to cart</button>
                </div>
            </div>
    </div>

    <div class="product-2" data-name="fertilizer" data-price="50">
        <img class="product-2-image" src="images/fertilizer.jpg" alt="fertilizer">
        <div class="product-2-info">
            <h3 class="product-2-name">Organic fertilizer</h3>
            <p class="product-2-price">R50/kg</p>
            <div class="product-2-buttons">
                <button class="product-2-seeds">Get-seeds</button>
                <button class="product-2-cart">Add to cart</button>
            </div>
        </div>
    </div>

    <div class="product-3" data-name="coriander" data-price="20">
        <img class="product-3-image" src="images/coriander.jpg" alt="coriander">
        <div class="product-3-info">
            <h3 class="product-3-name">Coriander</h3>
            <p class="product-3-price">R20/kg</p>
            <div class="product-3-buttons">
                <button class="product-3-seeds">Get-seeds</button>
                <button class="product-3-cart">Add to cart</button>
            </div>
        </div>
    </div>

     <div class="product-4" data-name="onion" data-price="30">
        <img class="product-4-image" src="images/onion.jpg" alt="coriander">
        <div class="product-4-info">
            <h3 class="product-4-name">onion</h3>
            <p class="product-4-price">R20/kg</p>
            <div class="product-4-buttons">
                <button class="product-4-seeds">Get-seeds</button>
                <button class="product-4-cart">Add to cart</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
